<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/admin/manifest.json">
  <link rel="apple-touch-icon" href="/admin/img/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/admin/img/icon-192.png">
  <title>WebSearch</title>
  <link rel="stylesheet" href="/admin/pwa.css">
</head>
<body>
  <div class="app">
    <div class="app-header">
      <div class="header-row">
        <div>
          <div class="header-title" id="page-title">Dashboard</div>
          <div class="header-subtitle" id="page-subtitle">Vue d'ensemble</div>
        </div>
        <button class="header-btn" onclick="refreshPage()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        </button>
      </div>
    </div>

    <div class="content">
      <!-- Dashboard -->
      <div class="page active" id="page-dashboard">
        <div class="stats-grid" id="stats-grid">
          <div class="stat-card"><div class="spinner"></div></div>
          <div class="stat-card"><div class="spinner"></div></div>
          <div class="stat-card"><div class="spinner"></div></div>
          <div class="stat-card"><div class="spinner"></div></div>
        </div>
        <div class="card">
          <div class="card-header"><div class="card-title">Activité récente</div></div>
          <div id="recent-activity"><div class="loading"><div class="spinner"></div></div></div>
        </div>
      </div>

      <!-- Chat -->
      <div class="page" id="page-chat" style="height:100%">
        <div class="chat-container">
          <div class="chat-messages" id="chat-messages">
            <div class="empty-state" id="chat-empty">
              <div class="empty-icon"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></div>
              <div class="empty-title">Nouvelle conversation</div>
              <div class="empty-desc">Posez une question ou lancez une recherche.</div>
            </div>
          </div>
          <div class="chat-input-bar">
            <div class="chat-input-wrap">
              <textarea class="chat-input" id="chat-input" placeholder="Message..." rows="1"></textarea>
              <button class="chat-send" id="chat-send" disabled onclick="sendMsg()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Threads -->
      <div class="page" id="page-threads">
        <div class="search-bar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" placeholder="Rechercher..." id="threads-search" oninput="filterThreads()">
        </div>
        <div id="threads-list"><div class="loading"><div class="spinner"></div></div></div>
      </div>

      <!-- Settings -->
      <div class="page" id="page-settings">
        <div class="settings-group">
          <div class="settings-group-title">Général</div>
          <div class="settings-list">
            <div class="settings-item"><span class="settings-label">Nom</span><span class="settings-value" id="set-name">—</span></div>
            <div class="settings-item"><span class="settings-label">Langue</span><span class="settings-value" id="set-lang">Français</span></div>
          </div>
        </div>
        <div class="settings-group">
          <div class="settings-group-title">IA</div>
          <div class="settings-list">
            <div class="settings-item"><span class="settings-label">Assistant</span><span class="settings-value" id="set-ai">WebSearch</span></div>
            <div class="settings-item"><span class="settings-label">Style</span><span class="settings-value" id="set-style">Équilibré</span></div>
          </div>
        </div>
        <div class="settings-group" id="install-group" style="display:none">
          <div class="settings-group-title">Application</div>
          <div class="settings-list">
            <div class="settings-item" onclick="installPWA()"><span class="settings-label" style="color:var(--primary)">Installer l'application</span></div>
          </div>
        </div>
        <div class="settings-group">
          <div class="settings-group-title">Actions</div>
          <div class="settings-list">
            <div class="settings-item" onclick="clearCache()"><span class="settings-label" style="color:var(--danger)">Vider le cache</span></div>
            <div class="settings-item" onclick="logout()"><span class="settings-label" style="color:var(--danger)">Se déconnecter</span></div>
          </div>
        </div>
      </div>
    </div>

    <nav class="tab-bar">
      <button class="tab-item active" data-tab="dashboard" onclick="go('dashboard',this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>Accueil</span>
      </button>
      <button class="tab-item" data-tab="chat" onclick="go('chat',this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        <span>Chat</span>
      </button>
      <button class="tab-item" data-tab="threads" onclick="go('threads',this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
        <span>Threads</span>
      </button>
      <button class="tab-item" data-tab="settings" onclick="go('settings',this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 010 4h-.09c-.658.003-1.25.396-1.51 1z"/></svg>
        <span>Réglages</span>
      </button>
    </nav>
  </div>
  <div class="toast-container" id="toasts"></div>
  <script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/admin/service-worker.js')
        .then(reg => console.log('SW registered:', reg.scope))
        .catch(err => console.log('SW error:', err));
    }
  </script>
  <script src="/admin/pwa.js"></script>
</body>
</html>
