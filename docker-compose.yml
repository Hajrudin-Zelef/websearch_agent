version: "3.8"

services:
  websearch-agent:
    build: .
    container_name: websearch-agent
    restart: unless-stopped
    ports:
      - "127.0.0.1:4500:4500"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      - PROVIDER=openrouter
      - SEARXNG_URL=http://searxng:8080
    depends_on:
      - searxng
    networks:
      - websearch

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8080"
    volumes:
      - searxng-data:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - websearch

volumes:
  searxng-data:

networks:
  websearch:
    driver: bridge
