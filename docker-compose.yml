services:
  # ============================================================================
  # WebSearch Agent — FastAPI server
  # ============================================================================
  websearch-agent:
    build: .
    container_name: websearch-agent
    restart: unless-stopped
    ports:
      - "127.0.0.1:4500:4500"
    env_file:
      - .env
    environment:
      - PROVIDER=openrouter
      - SEARXNG_URL=http://searxng:8080
    depends_on:
      searxng:
        condition: service_healthy
    networks:
      - websearch
    volumes:
      - websearch-data:/app/data
      - websearch-logs:/app/data/logs
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    sysctls:
      - net.core.somaxconn=65535
      - net.ipv4.tcp_max_syn_backlog=65535
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4500/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ============================================================================
  # SearXNG — Meta search engine
  # ============================================================================
  searxng:
    image: searxng/searxng:2024.12.25
    container_name: searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8080"
    volumes:
      - searxng-data:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - websearch
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ============================================================================
  # Nginx — Reverse proxy (optionnel, pour SSL)
  # ============================================================================
  # nginx:
  #   image: nginx:alpine
  #   container_name: nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #     - /etc/letsencrypt:/etc/letsencrypt:ro
  #   depends_on:
  #     - websearch-agent
  #   networks:
  #     - websearch
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: '0.5'
  #         memory: 128M

# ============================================================================
# Volumes
# ============================================================================
volumes:
  websearch-data:
    driver: local
  websearch-logs:
    driver: local
  searxng-data:
    driver: local

# ============================================================================
# Networks
# ============================================================================
networks:
  websearch:
    driver: bridge
